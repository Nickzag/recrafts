name: Recrafts Brand DS Locked Browser
on:
  push:
    branches: [chatgpt/recrafts-brand-ds-001-20261006]
    paths: [.github/workflows/chatgpt-brand-ds-dependencies.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium --only-shell
      - name: Export pinned browser binaries only
        run: |
          mkdir -p "$RUNNER_TEMP/recrafts-browser"
          tar -czf "$RUNNER_TEMP/recrafts-browser/browser-cache.tgz" -C "$HOME/.cache/ms-playwright" .
          cd "$RUNNER_TEMP/recrafts-browser"
          sha256sum browser-cache.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: recrafts-brand-ds-pinned-browser
          path: ${{ runner.temp }}/recrafts-browser/
          retention-days: 3
