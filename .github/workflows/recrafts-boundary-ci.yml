name: Recrafts Boundary CI

on:
  push:
    branches:
      - chatgpt/recrafts-boundary-001-20260917

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Full test suite
        run: npm test
      - name: R-013 validation
        run: npm run validate:r013
      - name: R-013 tests
        run: npm run test:r013
      - name: Package inventory dry-run
        run: npm pack --json --dry-run > "$RUNNER_TEMP/npm-pack.json"
