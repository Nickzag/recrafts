<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Datum Works — Source-neutral preview suite</title>
  <style>
    :root{--surface:#edf3ef;--ink:#17241f;--muted:#617069;--signal:#d37448;--support:#4e7164;--inverse:#f8fbf9;--space:clamp(16px,3vw,48px);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--surface)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--surface);color:var(--ink)}
    body.theme-a{--surface:#f3f0e8;--ink:#0b1c3a;--muted:#5d6470;--signal:#e55b43;--support:#3157b7;--inverse:#fff}
    body.theme-b{--surface:#f6eee7;--ink:#361425;--muted:#745f67;--signal:#20a39e;--support:#a33d63;--inverse:#fffaf5}
    a,button{min-width:44px;min-height:44px;color:inherit}a:focus-visible,button:focus-visible{outline:3px solid var(--signal);outline-offset:3px}
    nav{display:flex;justify-content:space-between;align-items:center;padding:18px var(--space);border-bottom:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}nav a{text-decoration:none;font-weight:700}.nav-links{display:flex;gap:20px;align-items:center}.nav-links a{display:grid;place-items:center}
    main{min-height:calc(100vh - 82px)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(42px,7vw,92px);line-height:.98;letter-spacing:-.055em;max-width:12ch}h2{font-size:clamp(28px,4vw,56px);line-height:1.02;letter-spacing:-.04em}p{font-size:clamp(16px,1.5vw,22px);line-height:1.55;color:var(--muted)}
    .eyebrow,.data{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;letter-spacing:.06em;text-transform:uppercase}.eyebrow{color:var(--support)}
    .button{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;background:var(--signal);color:var(--ink);text-decoration:none;font-weight:750;border-radius:8px}
    .frame{position:relative;border:1px solid var(--ink);background:color-mix(in srgb,var(--surface) 82%,var(--inverse));padding:var(--space)}.frame:before{content:"";position:absolute;inset:8px -8px -8px 8px;border:1px solid var(--support);pointer-events:none}.theme-b .frame{border-radius:16px}.theme-b .frame:before{inset:auto 5% -10px 5%;border-width:0 0 2px}
    figure{margin:0;position:relative;overflow:hidden;background:var(--inverse)}figure img{display:block;width:100%;height:100%;object-fit:cover}figcaption{position:absolute;left:16px;bottom:16px;max-width:290px;padding:12px 14px;background:var(--inverse);color:var(--ink);font:600 13px/1.4 ui-monospace,monospace}
    .hero-a{display:grid;grid-template-columns:minmax(0,5fr) minmax(320px,7fr);gap:clamp(32px,7vw,120px);padding:clamp(48px,8vw,120px) var(--space);align-items:end}.hero-a .copy{align-self:start}.hero-a figure{height:min(62vw,700px)}.hero-a .proof{display:grid;grid-template-columns:1fr auto;gap:16px;margin-top:28px}.hero-a .metric{padding:16px;border-top:2px solid var(--support)}
    .hero-b{display:grid;grid-template-columns:1fr minmax(280px,36%);grid-template-areas:"title evidence" "image evidence";gap:0;padding:var(--space)}.hero-b .title{grid-area:title;padding:4vw 4vw 7vw 0}.hero-b figure{grid-area:image;height:44vh;min-height:360px}.hero-b .evidence{grid-area:evidence;background:var(--ink);color:var(--inverse);padding:clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between}.hero-b .evidence p{color:color-mix(in srgb,var(--inverse) 72%,transparent)}
    .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ink);margin:0 var(--space) var(--space);border:1px solid var(--ink)}.strip article{padding:28px;background:var(--surface)}.value{font-size:clamp(36px,6vw,80px);font-weight:760;letter-spacing:-.05em}
    .sheet{padding:var(--space)}.sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.swatch,.component,.risk{min-height:220px;padding:24px;border:1px solid var(--ink);display:flex;flex-direction:column;justify-content:space-between}.swatch.signal{background:var(--signal)}.swatch.support{background:var(--support);color:var(--inverse)}.component button{border:0;background:var(--signal);font:inherit;font-weight:700;padding:12px 18px}.risk strong{font-size:46px}
    .poster,.social,.slide{min-height:100vh;padding:6%;display:grid;position:relative;overflow:hidden}.poster{grid-template-columns:1fr 1.15fr;gap:6%;align-items:end}.poster h1{font-size:clamp(64px,10vw,138px)}.poster figure{height:72vh}.poster .metric-card{position:absolute;right:4%;top:8%;background:var(--signal);padding:22px;max-width:280px}.poster.alt{grid-template-columns:1fr}.poster.alt .bars{display:grid;grid-template-columns:2fr 5fr 3fr;gap:12px;height:36vh;align-items:end}.poster.alt .bar{background:var(--support);min-height:30%}.poster.alt .bar:nth-child(2){height:100%;background:var(--signal)}.poster.alt .bar:nth-child(3){height:62%}
    .social{grid-template-rows:auto 1fr auto}.social .page-no{position:absolute;right:6%;top:6%}.social h1{align-self:center;font-size:clamp(68px,11vw,148px)}.social .evidence-block{align-self:center;border-left:10px solid var(--signal);padding-left:28px}.social .evidence-block strong{font-size:clamp(80px,15vw,190px);line-height:.85}.social .footer{display:flex;justify-content:space-between;align-items:end}
    .slide{grid-template-columns:1fr 1fr;gap:6%;align-items:center}.slide h1{font-size:clamp(76px,8vw,146px)}.slide .evidence-block{border-top:4px solid var(--signal);padding-top:32px}.slide .evidence-block strong{font-size:clamp(90px,12vw,210px)}
    .contact{padding:3%;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.contact article{aspect-ratio:4/5;border:1px solid var(--ink);padding:18px;display:flex;flex-direction:column;justify-content:space-between}.contact.slide-contact article{aspect-ratio:16/9}.contact h2{font-size:22px}.contact b{font-size:48px;color:var(--signal)}
    @media(max-width:700px){nav .nav-links a:not(.button){display:none}.hero-a,.hero-b,.poster,.slide{grid-template-columns:1fr;display:grid}.hero-a{padding-top:48px}.hero-a figure{height:52vh}.hero-b{grid-template-areas:"title" "image" "evidence"}.hero-b .title{padding:44px 0}.hero-b .evidence{min-height:360px}.strip,.sheet-grid{grid-template-columns:1fr}.poster figure{height:50vh}.frame:before{inset:6px -4px -6px 4px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <nav aria-label="Preview navigation"><a href="#main">DATUM WORKS</a><div class="nav-links"><a href="#evidence">Evidence</a><a class="button" href="#action">Inspect</a></div></nav>
  <main id="main"></main>
  <script>
    const q=new URLSearchParams(location.search);const kind=q.get('kind')||'web-a';const page=q.get('page')||'cover';
    if(kind.includes('web-b')||kind.includes('poster-b')||kind.includes('slide'))document.body.classList.add('theme-a');
    if(kind.includes('real-place')||kind.includes('theme-comparison-b'))document.body.classList.add('theme-b');
    const root=document.querySelector('main');
    const image=(file,alt,caption)=>`<figure><img src="../assets/${file}" alt="${alt}"><figcaption>${caption}</figcaption></figure>`;
    const pages={cover:['Make evidence usable','01'],problem:['Signals arrive without context','02'],insight:['A value matters only when attached','03'],mechanism:['Explain → attach → measure','04'],evidence:['18 ms','05'],['use-case']:['From conveyor event to verifiable record','06'],result:['37% fewer unresolved exceptions','07'],cta:['Inspect the next proof field','08']};
    const social=(slide=false)=>{const [title,n]=pages[page];return `<section class="${slide?'slide':'social'}"><span class="data page-no">${n} / 08</span><div><p class="eyebrow">Evidence Instrument</p><h1>${title}</h1></div><div class="evidence-block"><p>Operational sample</p>${page==='evidence'||page==='result'?`<strong>${title}</strong><p>Measured against the declared event window.</p>`:`<h2>One claim. One referent. One visible relationship.</h2>`}</div><div class="footer"><span class="data">DATUM WORKS</span>${page==='cta'?'<a class="button" href="#action">Open evidence</a>':'<span class="data">NEXT →</span>'}</div></section>`};
    const system=()=>`<section class="sheet"><p class="eyebrow">System Board</p><h1>Evidence Instrument Grammar</h1><div class="sheet-grid"><div class="swatch"><span class="data">Surface</span><strong>#EDF3EF</strong></div><div class="swatch signal"><span class="data">Signal ≤ 10%</span><strong>One priority</strong></div><div class="swatch support"><span class="data">Support</span><strong>Measured relationship</strong></div><div class="component"><span class="data">Display / Body / Data</span><h2>Sparse explanation.<br>Dense proof.</h2></div><div class="component frame"><span class="data">Boundary</span><h2>Offset frame</h2></div><div class="component"><span class="data">Image</span><h2>Object + operational context</h2></div></div></section>`;
    const components=()=>`<section class="sheet"><p class="eyebrow">Core Component Contract Sheet</p><h1>Five complete mechanisms</h1><div class="sheet-grid">${['Proof Canvas','Evidence Callout','Measured Boundary','Signal Action','Narrative Step'].map((x,i)=>`<article class="component ${i===2?'frame':''}"><span class="data">CORE 0${i+1}</span><h2>${x}</h2><p>States, responsive behavior, semantics and token dependencies declared.</p>${i===3?'<button type="button">Inspect state</button>':''}</article>`).join('')}</div></section>`;
    const themes=()=>`<section class="sheet"><p class="eyebrow">Theme Comparison</p><h1>One grammar, three expressions</h1><div class="sheet-grid"><article class="component"><span class="data">Mineral Ledger</span><h2>Offset frame<br>Copper signal</h2></article><article class="component" style="background:#f3f0e8;color:#0b1c3a;border-color:#0b1c3a"><span class="data">Cobalt Dispatch</span><h2>Stepped rule<br>Coral signal</h2></article><article class="component" style="background:#f6eee7;color:#361425;border-color:#361425;border-radius:16px"><span class="data">Burgundy Field</span><h2>Continuous field<br>Aqua signal</h2></article></div></section>`;
    const distance=()=>`<section class="sheet"><p class="eyebrow">Source-distance Comparison</p><h1>Mechanism retained.<br>Signature transformed.</h1><div class="sheet-grid"><article class="risk"><span class="data">Topology risk</span><strong>LOW</strong><p>2 / 10 source relationships retained.</p></article><article class="risk"><span class="data">Combination risk</span><strong>LOW</strong><p>Zero signature traits co-occur.</p></article><article class="risk"><span class="data">Gate</span><strong>PASS</strong><p>Palette, topology, boundary, object and CTA placement transformed.</p></article></div></section>`;
    if(kind==='web-a')root.innerHTML=`<section class="hero-a"><div class="copy"><p class="eyebrow">Operational Evidence / 01</p><h1>Turn movement into a verifiable record.</h1><p>Attach each measure to the object and event it describes. Keep the explanation sparse until proof is needed.</p><a class="button" href="#evidence">Inspect evidence</a></div><div class="frame">${image('commerce-cardboard.jpg','Corrugated cardboard moving through an operational conveyor','Conveyor event / Batch 042 / Licensed CC0 image')}<div id="evidence" class="proof"><div class="metric"><span class="data">Throughput</span><div class="value">84/min</div></div><div class="metric"><span class="data">Exceptions</span><div class="value">03</div></div></div></div></section><section class="strip"><article><span class="data">01 Explain</span><h2>One operational claim</h2></article><article><span class="data">02 Attach</span><h2>Evidence names its referent</h2></article><article id="action"><span class="data">03 Prove</span><h2>Boundaries expose the measure</h2></article></section>`;
    else if(kind==='web-b')root.innerHTML=`<section class="hero-b"><div class="title"><p class="eyebrow">FIELD INDEX / B</p><h1>Read the place before the number.</h1></div>${image('infrastructure-power-station.jpg','Public-domain view of a riverside power station','Place evidence / Public domain photograph')}<aside class="evidence"><div><span class="data">Grid context</span><h2>Three measures share one physical referent.</h2><p>Output, maintenance window and river level remain visibly attached to the site.</p></div><div id="action"><div class="value">62 MW</div><a class="button" href="#action">Read field note</a></div></aside></section>`;
    else if(kind==='system-board')root.innerHTML=system();
    else if(kind==='components')root.innerHTML=components();
    else if(kind==='theme-comparison')root.innerHTML=themes();
    else if(kind==='source-distance')root.innerHTML=distance();
    else if(kind==='poster-a')root.innerHTML=`<section class="poster"><div><p class="eyebrow">OBJECT / EVENT / PROOF</p><h1>Evidence travels with the object.</h1><p>Batch 042 / Internal demonstration</p></div>${image('commerce-cardboard.jpg','Cardboard on an industrial conveyor','84 units per minute / 3 exceptions')}<div class="metric-card data">ATTACHED VALUE<br><b>84 / MIN</b></div></section>`;
    else if(kind==='poster-b')root.innerHTML=`<section class="poster alt"><div><p class="eyebrow">COBALT DISPATCH / RESULT 07</p><h1>Measure the change, not the decoration.</h1></div><div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div><div class="data">BASELINE 38 / CURRENT 64 / DELTA +26</div></section>`;
    else if(kind==='carousel')root.innerHTML=social(false);
    else if(kind==='slide')root.innerHTML=social(true);
    else if(kind==='carousel-contact')root.innerHTML=`<section class="contact">${Object.entries(pages).map(([k,[t,n]])=>`<article><span class="data">${n}</span><h2>${t}</h2><b>→</b></article>`).join('')}</section>`;
    else if(kind==='slide-contact')root.innerHTML=`<section class="contact slide-contact">${Object.entries(pages).map(([k,[t,n]])=>`<article><span class="data">${n}</span><h2>${t}</h2><b>→</b></article>`).join('')}</section>`;
    else if(kind==='real-object')root.innerHTML=`<section class="hero-a"><div class="copy"><p class="eyebrow">Real-image proof / Object</p><h1>Each count names the event.</h1><p>No decorative data. The throughput and exception count describe the visible conveyor scenario.</p></div><div class="frame">${image('commerce-cardboard.jpg','Cardboard moving through an operational conveyor','CC0 / Streetsoda / Wikimedia Commons')}<div class="proof"><div class="metric"><span class="data">Throughput</span><div class="value">84/min</div></div><div class="metric"><span class="data">Exception</span><div class="value">03</div></div></div></div></section>`;
    else if(kind==='real-place')root.innerHTML=`<section class="hero-b"><div class="title"><p class="eyebrow">Real-image proof / Place</p><h1>A place anchors every measure.</h1></div>${image('infrastructure-power-station.jpg','Riverside power station with two chimneys','Public domain / Arpingstone / Wikimedia Commons')}<aside class="evidence"><div><span class="data">Place datum</span><h2>Output and maintenance belong to this facility.</h2></div><div><div class="value">62 MW</div><p>Illustrative semantic overlay</p></div></aside></section>`;
  </script>
</body>
</html>
