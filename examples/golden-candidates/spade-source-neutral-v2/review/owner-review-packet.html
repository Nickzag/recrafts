<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>R-010 项目所有者审阅</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#17241f;background:#edf3ef}*{box-sizing:border-box}body{margin:0}header{padding:48px max(24px,6vw);background:#17241f;color:#f8fbf9}header p{max-width:780px;color:#cbd8d2;line-height:1.7}.meta{font:13px/1.5 ui-monospace,monospace;color:#9db4aa}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;padding:28px max(20px,4vw) 80px}.content{display:grid;gap:24px}.card{background:#fff;border:1px solid #b8c7c0;border-radius:16px;overflow:hidden}.card h2,.card .body{padding-left:24px;padding-right:24px}.card h2{margin:24px 0 8px}.card .lead{margin:0 0 20px;color:#53645c;line-height:1.65}.visuals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#ccd7d2}.visuals.one{grid-template-columns:1fr}.visuals figure{margin:0;background:#f5f7f6;padding:14px}.visuals img{width:100%;display:block;border:1px solid #d6dfdb}.visuals figcaption{font-size:13px;margin-top:10px;color:#53645c}.decision{padding:20px 24px 24px;border-top:1px solid #d8e1dd}.decision legend{font-weight:700;margin-bottom:12px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.option{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid #aebdb6;border-radius:10px;cursor:pointer}.option:has(input:checked){background:#dfeae5;border-color:#17241f}textarea{width:100%;min-height:76px;margin-top:12px;border:1px solid #aebdb6;border-radius:10px;padding:12px;font:inherit}.refs{margin-top:12px;color:#6b7a73;font-size:13px}.sidebar{position:sticky;top:20px;align-self:start;background:#fff;border:1px solid #b8c7c0;border-radius:16px;padding:22px}.sidebar h2{margin-top:0}.status{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e2e8e5}.status b{color:#9a4a2f}.sidebar button{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:10px;background:#d37448;color:#17241f;font-weight:800;font-size:16px;cursor:pointer}.sidebar button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #3157b7;outline-offset:3px}.notice{padding:12px;background:#f7efe8;border-radius:10px;color:#6b3928;line-height:1.5}dialog{max-width:760px;width:calc(100% - 32px);border:0;border-radius:16px;padding:24px}pre{white-space:pre-wrap;max-height:60vh;overflow:auto;background:#101815;color:#dce7e2;padding:16px;border-radius:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;order:-1}}@media(max-width:620px){.visuals,.options{grid-template-columns:1fr}header{padding:32px 20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
<header><div class="meta">R-010 / package-91d1a8226792e35e / REVIEWABLE</div><h1>来源中立设计合同：项目所有者审阅</h1><p>请直接对照每张来源证据和新预览，确认“保留了机制，但没有复刻品牌签名”。每个判断都放在对应画面下方。引用字段仅供追溯，不需要填写。</p></header>
<div class="layout"><main class="content" id="review"></main><aside class="sidebar"><h2>审阅状态</h2><div id="progress" class="status"><span>已完成</span><b>0 / 8</b></div><p class="notice">当前 Package 仍为 <strong>reviewable</strong>。只有明确提交项目所有者结论后，才会执行 Correction 与 Acceptance。</p><label>审阅人<input id="reviewer" value="Nick" style="width:100%;padding:10px;margin-top:6px"></label><button id="export">生成审阅 JSON</button></aside></div>
<dialog id="dialog"><h2>项目所有者审阅结果</h2><pre id="output"></pre><button onclick="navigator.clipboard.writeText(document.querySelector('#output').textContent)">复制 JSON</button><button onclick="document.querySelector('#dialog').close()">关闭</button></dialog>
<script>
const items=[
{id:'scope-separation',title:'1. 来源范围是否正确分离？',lead:'左侧是 Together 的编辑型案例壳层；右侧是 Spade 当前产品品牌层。确认白底案例叙事、品牌色/字体/图形和平台 UI 没有被混成一个系统。',images:[['../captures/together-desktop/viewport-1440x900.png','Together 案例壳层 Evidence'],['../captures/spade-desktop/viewport-1440x900.png','Spade 品牌与产品站 Evidence']],refs:'Evidence：ev-together-desktop-viewport、ev-spade-desktop-viewport'},
{id:'core-grammar',title:'2. Core Grammar 是否来源中立？',lead:'Core 只保留稀疏解释、密集证据、语义附着、测量关系、单一主角和明确证明；不要求具体绿色、切角、轮廓物体或居中 Hero。',images:[['../previews/system/system-board.png','Visual System Board']],refs:'Artifact：core-grammar.json'},
{id:'themes',title:'3. 同一 Core 是否能产生明显不同的主题？',lead:'三个主题共享同一 Grammar。Cobalt Dispatch 为非绿色；Burgundy Field 使用连续圆角和规则场，不使用切角。',images:[['../previews/system/theme-comparison.png','三主题对照'],['../previews/posters/poster-alternative.png','非绿色替代主题海报']],refs:'Artifact：themes.json、theme-alternative-a.json、theme-alternative-b.json'},
{id:'source-distance',title:'4. 来源距离是否足够？',lead:'新输出改变了调色板家族、Hero 信息顺序、边界形式、主对象、CTA 位置和图片策略；来源拓扑匹配仅 2/10，签名组合风险为低。',images:[['../previews/system/source-distance-comparison.png','来源距离对照'],['../previews/web/web-b-1440.png','替代 Hero 拓扑']],refs:'Artifact：source-distance-report.json'},
{id:'components',title:'5. Core Component 是否达到可执行成熟度？',lead:'仅 5 个完整、已预览、带状态/键盘/响应式/语义合同的组件进入 Core。轮廓物体和连续跑马灯被拒绝，交易芯片降为 candidate。',images:[['../previews/system/core-component-sheet.png','Core Component Contract Sheet']],refs:'Artifact：components.json'},
{id:'web-topology',title:'6. Web A / Web B 是否是真正不同的结构？',lead:'Web A 是左侧叙事 + 右下物体证据；Web B 是左上标题 + 场所图片 + 右侧证据列。两者都没有复用源站居中标题/物体/CTA 和双侧轨道。',images:[['../previews/web/web-a-1440.png','Web A / Mineral Ledger'],['../previews/web/web-b-1440.png','Web B / Cobalt Dispatch']],refs:'Artifact：preview-coverage.json'},
{id:'cross-media',title:'7. 跨媒体预览是否足够支持 Pilot？',lead:'已生成两张独立海报、八张 Carousel、八张 16:9 Slide 和各自 Contact Sheet；单页文件不是由 Contact Sheet 冒充。',images:[['../previews/carousel/contact-sheet.png','8 页 Carousel Contact Sheet'],['../previews/slides/contact-sheet.png','8 页 Slide Contact Sheet']],refs:'Artifact：previews/carousel、previews/slides'},
{id:'imagery-accessibility',title:'8. 真实图像、可访问性与限制是否可接受？',lead:'两张开放许可照片都有与物体/场所一致的语义数据。自动门禁覆盖对比度、语义控件、焦点、reduced-motion、320/390 和内容压力；原生 Windows 字体、屏幕阅读器、性能与生产交互仍是 production-ready 门禁。',images:[['../previews/real-imagery/commerce-object.png','CC0 物体/商业场景'],['../previews/real-imagery/infrastructure-place.png','公有领域基础设施/场所']],refs:'Artifact：accessibility-report.json、font-metrics-report.json；引用为非必填'}
];
const root=document.querySelector('#review');root.innerHTML=items.map(item=>`<section class="card" data-id="${item.id}"><h2>${item.title}</h2><div class="body"><p class="lead">${item.lead}</p></div><div class="visuals ${item.images.length===1?'one':''}">${item.images.map(([src,cap])=>`<figure><img src="${src}" alt="${cap}"><figcaption>${cap}</figcaption></figure>`).join('')}</div><fieldset class="decision"><legend>请选择此项结论</legend><div class="options">${[['CONFIRM','确认'],['CHANGE','需要修改'],['REJECT','不通过']].map(([v,l])=>`<label class="option"><input type="radio" name="${item.id}" value="${v}">${l}</label>`).join('')}</div><textarea aria-label="${item.title}备注" placeholder="备注（可选）"></textarea><div class="refs">${item.refs}（无需填写）</div></fieldset></section>`).join('');
function progress(){const done=items.filter(x=>document.querySelector(`input[name="${x.id}"]:checked`)).length;document.querySelector('#progress b').textContent=`${done} / ${items.length}`}
document.addEventListener('change',progress);document.querySelector('#export').onclick=()=>{const decisions=items.map(item=>({item_id:item.id,verdict:document.querySelector(`input[name="${item.id}"]:checked`)?.value??null,note:document.querySelector(`[data-id="${item.id}"] textarea`).value.trim()}));const complete=decisions.every(x=>x.verdict);const overall=!complete?'INCOMPLETE':decisions.some(x=>x.verdict==='REJECT')?'REWORK':decisions.some(x=>x.verdict==='CHANGE')?'PASS_WITH_CHANGES':'PASS';const result={status:complete?'complete':'incomplete',reviewer_name:document.querySelector('#reviewer').value.trim(),reviewer_role:'Project Owner',review_date:'2026-07-16',package_id:'package-91d1a8226792e35e',overall_verdict:overall,decisions,artifact_refs_optional:true,evidence_refs_optional:true};document.querySelector('#output').textContent=JSON.stringify(result,null,2);document.querySelector('#dialog').showModal()};
</script>
</body></html>
